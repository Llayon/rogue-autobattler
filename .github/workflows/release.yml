name: Release

# R3: the GitHub Pages deployment is gated on the FULL success of the
# required CI jobs, ON THE SAME COMMIT SHA.
#
#   master commit SHA
#          |
#          v
#   test.yml (workflow_call, reusable)
#     /            \
# save-battle    battle-ecs
# migration
#     \            /
#          |
#      BOTH SUCCESS
#          |
#          v
#   web build -> artifact validation -> pages deploy -> runtime smoke
#
# The test jobs are NOT duplicated: this workflow CALLS test.yml. A
# reusable workflow runs INSIDE this run, so `needs:` below is a real
# dependency -- not a race between two independent workflows.
#
# The old web-build.yml is replaced by this file: it deployed after
# `build` alone, so a RED CI never stopped a publication.

on:
  push:
    branches: [master]
  # R3.4: a manual dispatch must NOT bypass the gate. It runs the SAME
  # required jobs on the SAME SHA, and the deploy job still needs them.
  #
  # There is deliberately NO input here. A dispatch already selects the
  # ref it runs on, and the gate applies to that ref's SHA: the gate is
  # a property of the SHA, not of the trigger. An input that looked
  # like a way to choose the target and did nothing would mislead an
  # operator into believing they controlled something they did not.
  workflow_dispatch:

# R3.5: the default permissions are read-only. The deploy job asks
# for exactly the two rights it needs, and nothing else has them.
permissions:
  contents: read

# R3.3 / RB4: the publication of one ref is serialized.
#
# WHAT THIS DOES: two runs of the SAME ref do not run at the same
# time. The second one QUEUES behind the first.
#
# WHAT THIS DOES NOT DO: it does NOT cancel the older run. With
# cancel-in-progress: false the OLDER run finishes FIRST and the
# newer one runs afterwards. An earlier version of this comment said
# that a newer commit cancels the older run; that was wrong, and it
# would have made a reader believe there were no ordering guarantee.
#
# WHAT PREVENTS A STALE PUBLICATION: the tip-check in the deploy job.
# It compares the SHA that is about to be published with the tip of
# the branch and refuses when they differ. An unreadable tip is a
# HOLD, never a GREEN.
#
# THE RESIDUAL WINDOW: the tip-check and the publication are two
# separate steps, so a newer commit pushed between them is not seen.
# The window is small and the guarantee is NOT atomic. The
# concurrency group bounds the outcome: the newer run cannot start
# until the older one has finished, so the newer publication happens
# after the older one and wins -- but the older publication did
# happen, briefly. Closing that window would need a protocol that
# re-checks the tip at the moment of the publication, which is
# recorded as a residual risk rather than built here.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------
  # The required CI jobs, on the SAME SHA as the publication.
  # -------------------------------------------------------------------
  required-tests:
    name: Required CI
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # -------------------------------------------------------------------
  # The web build. It runs only after BOTH required jobs succeeded.
  # -------------------------------------------------------------------
  web-build:
    name: Web Build
    needs: required-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GODOT_VERSION: '4.7-stable'
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p /opt/godot
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip -d /opt/godot
          chmod +x "/opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          ln -s "/opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot

      - name: Install Templates
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz" -O templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable/"
          unzip -qj templates.zip "templates/web_nothreads_release.zip" -d "$HOME/.local/share/godot/export_templates/4.7.stable/"

      - name: Build
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"
          # The export path must be ABSOLUTE: Godot resolves a relative
          # path against the editor's working directory, not against
          # the project, and the export fails with "the target folder
          # does not exist or is not accessible".
          godot --headless --path "$GITHUB_WORKSPACE" \
            --export-release "Web (no threads)" "$GITHUB_WORKSPACE/build/index.html"
          ls -la "$GITHUB_WORKSPACE/build/"

      # R3.3: the artifact must carry the SHA it was built from. The
      # build itself already ran on this SHA's checkout, but the
      # provenance is written into the artifact so the DEPLOYED bytes
      # can be traced back to the tested SHA.
      - name: Record the build provenance
        run: |
          set -euo pipefail
          echo "${{ github.sha }}" > build/BUILD_SHA
          echo "${{ github.sha }}" > build/BUILD_REF

      # R3.2 / R5: the artifact validation is a MANDATORY gate. A build
      # that produced no index.html, no WASM or an empty artifact must
      # NOT reach the deployment.
      - name: Validate the artifact
        run: |
          set -euo pipefail
          python tools/validate_web_artifact.py build

      # The artifact is uploaded by the job that BUILT it. The deploy
      # job downloads it from here, so the bytes that are published
      # are exactly the bytes that were validated.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  # -------------------------------------------------------------------
  # The deployment. It needs the build AND the validation, and it
  # carries the ONLY elevated permissions in this workflow.
  # -------------------------------------------------------------------
  deploy:
    name: Deploy to Pages
    needs: [required-tests, web-build]
    # RB2: the deployment is authorized ONLY from refs/heads/master.
    #
    # A manual dispatch runs the workflow file of the SELECTED ref, and
    # github.ref is then that ref. Without this condition, a dispatch
    # of a staging, a feature or a phase3 branch would build, validate
    # and PUBLISH that SHA to GitHub Pages, as long as the tests of the
    # same ref were green -- and the tip-check does not help, because
    # the dispatched SHA is the tip of the dispatched branch.
    #
    # success() is the default for a job whose needs succeeded, and it
    # is REQUIRED for "one required job failed -> DENY" to hold. It is
    # NOT an always() bypass: always() would run the job even when a
    # required job failed, which is exactly what must not happen.
    #
    # The full ref is compared, EXACTLY: refs/heads/master is the
    # branch master, refs/tags/v1 is a tag, and feature/master is a
    # different branch whose name merely ends with master.
    if: >-
      ${{
        success() &&
        github.ref == 'refs/heads/master' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # R3.3 / RB4: a run that is no longer the tip of the branch must
      # not overwrite the newer publication.
      #
      # The concurrency group does NOT cancel the older run --
      # cancel-in-progress is false, so the older run finishes first
      # and the newer one queues behind it. The guarantee against a
      # stale publication therefore rests on THIS check, and not on
      # the concurrency group.
      #
      # The check is fail-closed: an unreadable tip is a HOLD, never
      # a GREEN, because a check that compared nothing would silently
      # approve everything.
      #
      # The residual window: this check and the publication are two
      # separate steps, so a commit pushed between them is not seen.
      # The guarantee is not atomic.
      #
      # The checkout is REQUIRED: without a repository there is no
      # remote to ask, and the check would silently compare nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify the SHA is still the tip of the branch
        run: |
          set -euo pipefail
          TIP="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          echo "the tip of ${GITHUB_REF_NAME}: $TIP"
          echo "the SHA being published: ${{ github.sha }}"
          if [ -z "$TIP" ]; then
            echo "HOLD: the tip of ${GITHUB_REF_NAME} could not be read."
            echo "An unreadable tip is a HOLD, never a GREEN."
            exit 1
          fi
          if [ "$TIP" != "${{ github.sha }}" ]; then
            echo "HOLD: ${{ github.sha }} is not the tip of ${GITHUB_REF_NAME} ($TIP is)."
            echo "A stale deployment must not supersede a newer commit."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      # The artifact comes from the build job, which uploaded the
      # bytes it validated. The deploy job must NOT upload a local
      # build/ directory: it has none.
      - id: deployment
        uses: actions/deploy-pages@v4
