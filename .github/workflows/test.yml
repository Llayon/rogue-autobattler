name: Save and Battle Migration

on:
  push:
  pull_request:
  # R3: the release workflow CALLS this one, so the deployment depends
  # on the REAL test jobs of the SAME commit SHA. A reusable workflow
  # runs inside the calling workflow's run, so `needs:` in the release
  # workflow is a genuine dependency -- not a race between two
  # independent workflows that happen to watch the same branch.
  workflow_call:

# R3.5: the test jobs never need to write to the repository, to the
# Pages, or to mint an OIDC token. The deploy rights live ONLY in the
# deploy job of the release workflow.
permissions:
  contents: read

jobs:
  save-battle-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.7-stable'
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p /opt/godot
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip -d /opt/godot
          chmod +x "/opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          ln -s "/opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot

      - name: Lint core and scenes
        run: python tools/lint_anti_patterns.py

      - name: Parse project in editor mode
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-editor.log
          ! grep -nE 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/godot-editor.log

      - name: Run legacy regression suite
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/run_tests.gd 2>&1 | tee /tmp/legacy-regression.log
          ! grep -nE 'SCRIPT ERROR|Parse Error|ERROR:|\[FAIL\]' /tmp/legacy-regression.log
          grep -E 'Result:' /tmp/legacy-regression.log | tail -1

      - name: Run legacy characterization suite (3 runs, all produce result, identical)
        run: |
          set -euo pipefail
          for run in $(seq 1 3); do
            godot --headless --path . --script tests/legacy_characterization/legacy_characterization_test.gd 2>&1 | tee "/tmp/legacy-characterization-${run}.log"
            ! grep -nE 'SCRIPT ERROR|Parse Error|ERROR:|\[FAIL\]' "/tmp/legacy-characterization-${run}.log"
            grep -q 'Legacy characterization:' "/tmp/legacy-characterization-${run}.log"
          done
          LINES=$(grep -h 'Legacy characterization:' /tmp/legacy-characterization-*.log | sort -u)
          echo "$LINES"
          test "$(echo "$LINES" | wc -l)" -eq 1
          test "$(grep -h 'Legacy characterization:' /tmp/legacy-characterization-*.log | wc -l)" -eq 3

      - name: Run legacy save fixture loader
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/legacy_save_fixtures/loader_test.gd 2>&1 | tee /tmp/legacy-save-loader.log
          ! grep -nE 'SCRIPT ERROR|Parse Error|ERROR:|\[FAIL\]' /tmp/legacy-save-loader.log
          grep -E 'legacy save loader:' /tmp/legacy-save-loader.log | tail -1

      - name: Run save schema v4 suite
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/save_schema_v4/save_schema_v4_test.gd 2>&1 | tee /tmp/save-schema-v4.log
          ! grep -nE 'SCRIPT ERROR|Parse Error|ERROR:|\[FAIL\]' /tmp/save-schema-v4.log
          grep -E 'save schema v4 .* migrator:' /tmp/save-schema-v4.log | tail -1

      - name: Run save schema v4 byte-for-byte determinism
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/save_schema_v4/byte_for_byte_determinism_test.gd 2>&1 | tee /tmp/save-schema-v4-byte.log
          ! grep -nE 'SCRIPT ERROR|Parse Error|ERROR:|\[FAIL\]' /tmp/save-schema-v4-byte.log
          grep -E 'byte-for-byte determinism:' /tmp/save-schema-v4-byte.log | tail -1

      - name: Run production save repository suite
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/save_repository/save_repository_test.gd 2>&1 | tee /tmp/save-repository.log
          ! grep -nE 'SCRIPT ERROR|Parse Error|ERROR:|\[FAIL\]' /tmp/save-repository.log
          grep -E 'production save repository:' /tmp/save-repository.log | tail -1

      - name: Run RunSaveFileOps suite
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/save_repository/run_save_file_ops_test.gd 2>&1 | tee /tmp/save-file-ops.log
          ! grep -nE 'SCRIPT ERROR|Parse Error|ERROR:|\[FAIL\]' /tmp/save-file-ops.log
          grep -E 'run save file ops:' /tmp/save-file-ops.log | tail -1

      - name: Run RunUnit is_alive suite
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/progression/run_unit_test.gd 2>&1 | tee /tmp/save-run-unit.log
          ! grep -nE 'SCRIPT ERROR|Parse Error|ERROR:|\[FAIL\]' /tmp/save-run-unit.log
          grep -E 'run unit is_alive:' /tmp/save-run-unit.log | tail -1

  # TD-08: the Phase-3 Battle ECS suites were never executed by CI.
  # The job above runs the legacy suite, the characterization suite
  # and the save suites, but nothing under tests/battle_ecs/. A
  # separate job keeps the Phase-3 gate visually independent from the
  # legacy/save pipeline.
  battle-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7-stable'
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p /opt/godot
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip -d /opt/godot
          chmod +x "/opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          ln -s "/opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot

      - name: Import project cache
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit || true

      - name: Run every standalone suite
        run: |
          set -euo pipefail
          python tools/run_battle_ecs_suites.py --godot godot --root . | tee /tmp/standalone-suites.log
          grep -q 'RUNNER: GREEN' /tmp/standalone-suites.log

      - name: Run the A-H semantic differential
        run: |
          set -euo pipefail
          # The A-H differential compares the candidate against a
          # BASELINE COMMIT.
          #
          # R3.6: the baseline used to be HEAD^, the predecessor of the
          # pushed commit. That is WRONG for the release: after Phase 3
          # is merged into master, HEAD^ is the previous MASTER commit,
          # which predates the A-H probe entirely -- the probe does not
          # exist there, so the differential would compare nothing and
          # "pass" over an empty comparison.
          #
          # The baseline is therefore PINNED to the published Phase 3
          # commit, the last state in which the A-H fixtures are known
          # to exist and to be meaningful. A pinned baseline is also
          # stable: every release compares against the same known-good
          # reference instead of drifting with the branch.
          #
          # When the baseline cannot be fetched, the step HOLDs. It does
          # NOT skip and it does NOT pass: an unavailable mandatory
          # baseline is a HOLD, never a GREEN.
          AH_BASELINE_SHA="${AH_BASELINE_SHA:-4316a32e210b8660b77a6eda916fb28c4f3bcb8a}"
          echo "the pinned A-H baseline: $AH_BASELINE_SHA"
          if ! git cat-file -e "${AH_BASELINE_SHA}^{commit}" 2>/dev/null; then
            echo "the pinned A-H baseline is not in the shallow history; fetching it"
            git fetch --no-tags --depth=1 origin "$AH_BASELINE_SHA"
          fi
          if ! git cat-file -e "${AH_BASELINE_SHA}^{commit}" 2>/dev/null; then
            echo "HOLD: the pinned A-H baseline $AH_BASELINE_SHA could not be fetched."
            echo "An unavailable mandatory baseline is a HOLD, never a GREEN."
            exit 1
          fi
          # The baseline must really carry the probe: an empty baseline
          # would make the comparison vacuous.
          if ! git cat-file -e "${AH_BASELINE_SHA}:tests/battle_ecs/effects/b64c_ah_diff_probe.gd" 2>/dev/null; then
            echo "HOLD: the pinned A-H baseline carries no A-H probe."
            exit 1
          fi
          git worktree add --detach /tmp/ah-baseline "$AH_BASELINE_SHA"
          python tools/run_ah_semantic_differential.py \
            --baseline /tmp/ah-baseline \
            --candidate "$GITHUB_WORKSPACE" \
            --godot godot
          git worktree remove --force /tmp/ah-baseline

      - name: Validate the Run Integrity ledger
        run: python tools/validate_run_integrity_ledger.py

      # R-03: the validator above only proves that the REAL ledger
      # passes. Without the controls, a validator that accepted
      # EVERYTHING would keep CI green forever -- which is exactly the
      # H-10 failure mode. The controls run on temporary copies, so
      # the production ledger is never touched.
      - name: Check the Run Integrity ledger validator
        run: python tests/ci/ledger_validator_test.py

      - name: Check the standalone runner contract
        run: python tests/ci/standalone_runner_test.py

      - name: Check the A-H differential contract
        run: python tests/ci/ah_differential_test.py

      - name: Check the standalone runner negative controls
        run: python tools/ci_negative_controls.py

      - name: Check the A-H differential negative controls
        run: python tools/ah_negative_controls.py

      - name: Check the battle entry negative controls
        run: python tools/entry_negative_controls.py

      - name: Audit the standalone harness exit contract
        run: python tools/audit_test_exit_contract.py

      - name: Audit the legacy test reachability
        run: python tools/audit_run_tests_reachability.py
