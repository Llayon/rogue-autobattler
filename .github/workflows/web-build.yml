name: Web Build
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7-stable'
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          mkdir -p /opt/godot
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip -d /opt/godot
          chmod +x /opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64
      - name: Install Templates
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz" -O templates.zip
          mkdir -p $HOME/.local/share/godot/export_templates/4.7.stable/
          unzip -qj templates.zip "templates/web_nothreads_release.zip" -d $HOME/.local/share/godot/export_templates/4.7.stable/
      - name: Import Resources
        # Force Godot to scan all .tres files and generate .import sidecars.
        # Without this, .tres files are included in pck but cannot be loaded
        # by ResourceLoader at runtime (empty/unparseable resource).
        run: |
          /opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64 \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --quit
          # Verify .import files were created.
          echo "--- Generated .import files ---"
          find content -name '*.import' | head -10
          echo "--- Total count ---"
          find content -name '*.import' | wc -l

      - name: Build
        run: |
          set -eo pipefail
          mkdir -p build
          /opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Web (no threads)" "build/index.html"
          ls -la build/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
